<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0b">
<title>角色档案 · A_SU ARCHIVE</title>
<meta name="description" content="角色档案与设定图集 —— A_SU ARCHIVE。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="character">


<header class="topbar" id="topbar">
  <a class="brand" href="index.html" aria-label="A_SU ARCHIVE 首页">
    <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2.5 L29.5 16 L16 29.5 L2.5 16 Z" fill="none" stroke="#ffd400" stroke-width="1.3"/>
      <path d="M16 9 L23 16 L16 23 L9 16 Z" fill="#ffd400" fill-opacity=".85"/>
    </svg>
    <span class="brand__text">
      <span class="brand__en" data-label="brandEn">A_SU ARCHIVE</span>
      <span class="brand__cn" data-label="brandCn">设定档案</span>
    </span>
  </a>
  <nav class="nav" aria-label="主导航">
    <a href="index.html#index" data-short="IDX" data-label-short="navShort.idx"><span data-label="nav.idx">索引 INDEX</span></a>
    <a href="#dossier" data-short="FILE" data-label-short="navShort.dossier"><span data-label="nav.dossier">档案 DOSSIER</span></a>
    <a href="#gallery" data-short="GAL" data-label-short="navShort.gallery"><span data-label="nav.gallery">画廊 GALLERY</span></a>
  </nav>
  <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="切换到夜晚模式">
    <span class="theme-toggle__dot" aria-hidden="true"></span>
    <span class="theme-toggle__label">DAY</span>
  </button>
  <div class="topbar__meta">LOCAL DEMO</div>
</header>

<main class="shell">

  <!-- ================= 角色头部 ================= -->
  <section class="dh">
    <div class="dh__glow"></div>
    <div class="wrap dh__inner">
      <div class="dh__left" id="dhLeft"></div>
      <div class="dh__plate-order">
        <div class="plate corners" id="plate"></div>
      </div>
    </div>
  </section>

  <!-- ================= 档案表 ================= -->
  <section class="section" id="dossier">
    <div class="wrap">
      <div class="section-head" data-reveal>
        <div class="section-head__idx"><i></i>01</div>
        <div class="section-head__t"><h2 data-label="heads.dossier.cn">档案</h2><span data-label="heads.dossier.en">DOSSIER</span></div>
        <div class="section-head__meta">PROFILE TABLE</div>
      </div>
      <div class="dossier" id="dossierGrid"></div>
    </div>
  </section>

  <!-- ================= 画廊 ================= -->
  <section class="section section--tight" id="gallery">
    <div class="wrap">
      <div class="section-head" data-reveal>
        <div class="section-head__idx"><i></i>02</div>
        <div class="section-head__t"><h2 data-label="heads.gallery.cn">画廊</h2><span data-label="heads.gallery.en">GALLERY</span></div>
        <div class="section-head__meta" data-label="hints.gallery">点击查看大图</div>
      </div>
      <div class="filters" id="filters" role="group" aria-label="分类筛选"></div>
      <div class="masonry" id="masonry"></div>
    </div>
  </section>

  <!-- ================= 另一位角色 ================= -->
  <section class="section section--tight">
    <div class="wrap">
      <a class="xcard" id="xcard" href="index.html#index"></a>
    </div>
  </section>

  <footer class="foot wrap">
    <div class="foot__l">
      <svg class="foot__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.5 L29.5 16 L16 29.5 L2.5 16 Z" fill="none" stroke="#ffd400" stroke-width="1.4"/>
        <path d="M16 9 L23 16 L16 23 L9 16 Z" fill="#ffd400" fill-opacity=".8"/>
      </svg>
      <span class="foot__t" data-label="footer.tagline">A_SU ARCHIVE — 本地演示 · 非官方同人档案</span>
    </div>
    <div class="foot__r">
      <span data-label="footer.source">SOURCE · D:\Asu\A_su的设定图集</span>
      <span><i style="font-style:normal" data-label="footer.build">BUILD ·</i> <span id="footVer">v0.1.0-demo</span></span>
    </div>
  </footer>

    <div class="foot-meta wrap">
    <a class="counter js-counter"
       href="https://github.com/journey-ad/Moe-counter" target="_blank" rel="noopener noreferrer"
       title="Moe-counter 浏览量">
      <span class="counter__label">VISITORS</span>
      <img class="counter__img js-moe" alt="访问量" decoding="async" referrerpolicy="no-referrer">
      <span class="counter__fallback js-counter-fallback"><b class="js-count">—</b> 次 · 本地计数</span>
    </a>
    <span class="counter__note">COUNT BY MOE-COUNTER</span>
  </div>
</main>

<noscript>
  <p style="padding:120px 24px;text-align:center;color:#a6a6ad">
    这个页面需要 JavaScript 才能从 data.js 里读取图集数据，请开启后刷新。
  </p>
</noscript>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
